name: Lint CSS

on:
  pull_request:
    paths:
      - '**.css'

jobs:
  css-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer stylelint
        run: npm install --no-save stylelint

      - name: Vérifier les fichiers CSS
        run: npx stylelint "theme/webradio-child/assets/css/**/*.css"
